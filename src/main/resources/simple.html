<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RuneCast Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: transparent;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .container {
            text-align: center;
        }
        .title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .status {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title" id="title">Page</div>
        <div class="status" id="status">Loading...</div>
    </div>
    <script>
        const eventSource = new EventSource('/sse');
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            document.getElementById('status').textContent = 'Connected - Updates available';
        };
        eventSource.onerror = function(event) {
            console.log('SSE connection error, attempting to reconnect...');
        };
        window.addEventListener('beforeunload', function() {
            eventSource.close();
        });
    </script>
</body>
</html>
