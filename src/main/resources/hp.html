<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RuneCast HP</title>
    <style>
        :root {
            --hp-color: #00ff00;
            --hp-percent: 100%;
            --max-hp: 99;
            --current-hp: 99;
        }
        
        .hp-fill {
            height: 100%;
            width: var(--hp-percent);
            transition: width 0.3s ease;
        }
        
        .hp-fill.low-hp {
            background: linear-gradient(90deg, #ff0000, #ff000080);
        }
        
        .hp-fill.medium-hp {
            background: linear-gradient(90deg, #ffff00, #ffff0080);
        }
        
        .hp-fill.high-hp {
            background: linear-gradient(90deg, #00ff00, #00ff0080);
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: transparent;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        .hp-container {
            text-align: center;
        }
        
        .hp-text {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .hp-bar {
            width: 300px;
            height: 30px;
            background: rgba(0,0,0,0.5);
            border: 2px solid white;
            border-radius: 15px;
            margin: 0 auto;
            overflow: hidden;
        }
        
        .hp-percent {
            font-size: 24px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="hp-container">
        <div class="hp-text" id="hp-text">99/99</div>
        
        <div class="hp-bar" id="hp-bar-container" style="display: none;">
            <div class="hp-fill" id="hp-fill"></div>
        </div>
        <div class="hp-percent" id="hp-percent" style="display: none;">100%</div>
    </div>

    <script>
        const eventSource = new EventSource('/sse');
        
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            const hpPercent = data.maxHp > 0 ? (data.hp * 100) / data.maxHp : 0;
            
            let hpColor;
            let hpClass;
            if (hpPercent > 50) {
                hpColor = '#00ff00';
                hpClass = 'high-hp';
            } else if (hpPercent > 25) {
                hpColor = '#ffff00';
                hpClass = 'medium-hp';
            } else {
                hpColor = '#ff0000';
                hpClass = 'low-hp';
            }
            
            document.documentElement.style.setProperty('--hp-color', hpColor);
            document.documentElement.style.setProperty('--hp-percent', hpPercent + '%');
            document.documentElement.style.setProperty('--max-hp', data.maxHp);
            document.documentElement.style.setProperty('--current-hp', data.hp);
            
            document.getElementById('hp-text').textContent = data.hp + '/' + data.maxHp;
            
            if (data.showHpBar) {
                document.getElementById('hp-bar-container').style.display = 'block';
                document.getElementById('hp-percent').style.display = 'block';
                
                const hpFill = document.getElementById('hp-fill');
                hpFill.style.width = hpPercent + '%';
                
                hpFill.classList.remove('high-hp', 'medium-hp', 'low-hp');
                hpFill.classList.add(hpClass);
                
                document.getElementById('hp-percent').textContent = Math.round(hpPercent) + '%';
            } else {
                document.getElementById('hp-bar-container').style.display = 'none';
                document.getElementById('hp-percent').style.display = 'none';
            }
        };
        
        eventSource.onerror = function(event) {
            console.log('SSE connection error, attempting to reconnect...');
        };
        
        window.addEventListener('beforeunload', function() {
            eventSource.close();
        });
    </script>
</body>
</html>
