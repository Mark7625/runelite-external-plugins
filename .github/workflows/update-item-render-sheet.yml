name: Update item render sheet

on:
  schedule:
    - cron: '30 4,16 * * *'
    # Hourly through the usual Wednesday game update window
    - cron: '50 10-15 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-item-render-sheet

env:
  SHEET_PATH: src/main/resources/io/mark/hditemicons/item_render_sheet.csv
  GENERATOR_DIR: tools/item-render-sheet-generator

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Clone the OSRS cache
        run: |
          git clone --depth 1 https://github.com/abextm/osrs-cache.git
          echo "CACHEVER=$(git -C osrs-cache log -1 --format='%h %s')" >> "$GITHUB_ENV"

      - name: Generate the sheet
        working-directory: ${{ env.GENERATOR_DIR }}
        run: gradle run --args="../../osrs-cache ../../$SHEET_PATH '$CACHEVER'"

      # A truncated cache should fail loudly, not publish a sheet missing most items
      - name: Sanity-check row count
        run: |
          n=$(grep -cv '^#' "$SHEET_PATH")
          echo "$n rows"
          [ "$n" -ge 15000 ] || { echo "::error::item_render_sheet has $n rows, floor is 15000"; exit 1; }

      # The cache header changes every run even when the data doesn't, so ignore it in the diff
      - name: Commit and push if the data changed
        run: |
          if git diff --quiet -I '^# cache: ' -- "$SHEET_PATH"; then
            echo "No data changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SHEET_PATH"
          git commit -m "Update item render sheet: $CACHEVER"
          git push
